<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-label="Sort by Rating extension preview">
  <rect width="720" height="300" fill="#f3f4f6"/>

  <!-- browser chrome -->
  <rect x="0" y="0" width="720" height="40" fill="#e5e7eb"/>
  <circle cx="24" cy="20" r="6" fill="#ef4444"/>
  <circle cx="44" cy="20" r="6" fill="#f59e0b"/>
  <circle cx="64" cy="20" r="6" fill="#22c55e"/>
  <rect x="90" y="10" width="420" height="20" rx="10" fill="#ffffff"/>

  <!-- page -->
  <rect x="0" y="40" width="720" height="260" fill="#ffffff"/>

  <!-- product cards -->
  <g font-family="-apple-system, Segoe UI, Roboto, Arial, sans-serif">
    <g>
      <rect x="24" y="64" width="200" height="120" rx="10" fill="#f9fafb" stroke="#e5e7eb"/>
      <rect x="40" y="80" width="168" height="52" rx="6" fill="#eef2ff"/>
      <text x="40" y="152" font-size="12" fill="#111827" font-weight="600">Top rated product</text>
      <text x="40" y="170" font-size="12" fill="#b45309">★ 4.8 · 15,204 ratings</text>
    </g>
    <g>
      <rect x="244" y="64" width="200" height="120" rx="10" fill="#f9fafb" stroke="#e5e7eb"/>
      <rect x="260" y="80" width="168" height="52" rx="6" fill="#eef2ff"/>
      <text x="260" y="152" font-size="12" fill="#111827" font-weight="600">Second product</text>
      <text x="260" y="170" font-size="12" fill="#b45309">★ 4.5 · 6,120 ratings</text>
    </g>
    <g>
      <rect x="464" y="64" width="200" height="120" rx="10" fill="#f9fafb" stroke="#e5e7eb"/>
      <rect x="480" y="80" width="168" height="52" rx="6" fill="#eef2ff"/>
      <text x="480" y="152" font-size="12" fill="#111827" font-weight="600">Third product</text>
      <text x="480" y="170" font-size="12" fill="#b45309">★ 4.2 · 812 ratings</text>
    </g>

    <text x="24" y="222" font-size="12" fill="#6b7280">
      Sorted by number of ratings — products with no ratings stay at the bottom.
    </text>
  </g>

  <!-- quick sort bar -->
  <g font-family="-apple-system, Segoe UI, Roboto, Arial, sans-serif">
    <rect x="430" y="240" width="270" height="40" rx="20" fill="#111827" opacity="0.96"/>
    <text x="452" y="265" font-size="12" fill="#9ca3af" font-weight="600" letter-spacing="1">SORT BY</text>
    <rect x="518" y="248" width="150" height="24" rx="12" fill="#1f2937" stroke="#374151"/>
    <text x="532" y="264" font-size="12" fill="#f9fafb">Most rated (reviews)</text>
    <path d="M648 258h10l-5 6z" fill="#9ca3af"/>
    <text x="676" y="266" font-size="16" fill="#9ca3af">×</text>
  </g>
</svg>
